<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Teacher Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <nav class="p-6 bg-white shadow-sm flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-800">{{profile.name}} | Educator</h1>
        <div class="space-x-4">
            <a href="#" class="text-gray-600 hover:text-blue-600">About</a>
            <a href="#" class="text-gray-600 hover:text-blue-600">Lessons</a>
            <a href="#" class="bg-blue-600 text-white px-4 py-2 rounded">Contact</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-20 text-center">
        <div class="mb-8 flex justify-center">
            <div class="w-40 h-40 rounded-full border-4 border-white shadow-lg overflow-hidden ring-2 ring-blue-100">
                {% if profile.profile_image %}
                    <img src="{{ profile.profile_image.url }}" alt="{{ profile.name }}" class="w-full h-full object-cover">
                {% else %}
                    <img src="https://via.placeholder.com/160" alt="Default" class="w-full h-full object-cover">
                {% endif %}
            </div>
        </div>

        <h2 class="text-5xl font-extrabold text-gray-900 mb-2">Hello, I'm {{ profile.name }}</h2>
        <p class="text-blue-600 font-medium mb-6 uppercase tracking-widest">{{ profile.title }}</p>
        
        <p class="text-xl text-gray-600 mb-8 leading-relaxed">
            {{ profile.bio }}
        </p>

        <div class="flex justify-center gap-4">
            <a href="#lessons" class="bg-slate-800 text-white px-6 py-3 rounded-lg hover:bg-slate-700">
                View My Work
            </a>
        </div>
    </main>

    <script>
        document.getElementById('alertBtn').addEventListener('click', () => {
            alert('Welcome to my portfolio! More lessons coming soon.');
        });
    </script>

</body>
</html>
